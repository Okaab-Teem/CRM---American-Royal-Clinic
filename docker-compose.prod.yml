services:
  # Database Service (Microsoft SQL Server 2022)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flowcrm-prod-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-FlowCrmProdStrongPass123!}"
      MSSQL_PID: "Express"
    volumes:
      - flowcrm-prod-db-data:/var/opt/mssql
    networks:
      - flowcrm-internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ASP.NET Core API (.NET 10)
  backend:
    build:
      context: .
      dockerfile: src/FlowCRM.Api/Dockerfile
    container_name: flowcrm-prod-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__FlowCrm: "Server=sqlserver,1433;Database=FlowCRM_Prod;User Id=sa;Password=${DB_PASSWORD:-FlowCrmProdStrongPass123!};TrustServerCertificate=True;Encrypt=True"
      DatabaseProvider: "SqlServer"
      Jwt__Key: "${JWT_SECRET:-FlowCRM_SuperSecretKey_ProductionVault_Requires32BytesMinLength!}"
      Jwt__Issuer: "FlowCRM-Production"
      Jwt__Audience: "FlowCRM-Client"
      Cors__AllowedOrigins__0: "http://localhost"
      Cors__AllowedOrigins__1: "${APP_DOMAIN:-http://localhost}"
    networks:
      - flowcrm-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # React 19 Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowcrm-prod-web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - flowcrm-internal

networks:
  flowcrm-internal:
    driver: bridge

volumes:
  flowcrm-prod-db-data:
