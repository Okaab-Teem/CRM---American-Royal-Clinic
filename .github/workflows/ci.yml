name: FlowCRM Production CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-build-test:
    name: Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore FlowCRM.slnx

      - name: Compile Solution (Release)
        run: dotnet build FlowCRM.slnx -c Release --no-restore

      - name: Execute Automated Test Suite
        run: dotnet test FlowCRM.slnx -c Release --no-build --verbosity normal

  frontend-build-audit:
    name: Frontend Build & Typecheck (React 19 / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline

      - name: Build Production Distribution
        run: npm run build

  docker-image-validation:
    name: Docker Multi-Stage Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-audit]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/FlowCRM.Api/Dockerfile
          push: false
          tags: flowcrm-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: flowcrm-frontend:latest
